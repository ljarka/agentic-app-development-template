name: Release

# Push a tag like v1.2.0 to build a signed APK and publish a GitHub release with it.
# Secrets (Settings → Secrets → Actions): APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD,
# APP_KEY_ALIAS, APP_KEY_PASSWORD. See README, "Releases".
on:
  push:
    tags: ["v*"]

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=60000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=5

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the APP_KEYSTORE_BASE64 secret (see README, Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "APP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew verifyPaparazziDebug assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(sed -n 's/^rootProject\.name = "\(.*\)"/\1/p' settings.gradle.kts)"
          apk="${name}-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
