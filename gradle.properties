# Base package of the whole app. Convention plugins derive every module's namespace from it
# (":feature:home" -> "<basePackage>.feature.home"); scripts/new-feature.sh reads it too.
# Change it only with ./scripts/init-project.sh (it also moves the source directories).
project.basePackage=com.example.template
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
